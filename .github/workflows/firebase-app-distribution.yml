name: Firebase App Distribution

on:
  push:
    branches:
      - release/**
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes shown to Firebase App Distribution testers
        required: false
        type: string
        default: ""

concurrency:
  group: firebase-app-distribution-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-distribute:
    name: Build signed release APK and distribute
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 18
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "18"

      # v3 defaults include the removed Google `tools` package and fails with
      # "Failed to find package 'tools'". v4 installs platform-tools only.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "::error::Missing secret RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p keystore
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > keystore/release.jks
          if [ ! -s keystore/release.jks ]; then
            echo "::error::Decoded keystore is empty — check RELEASE_KEYSTORE_BASE64"
            exit 1
          fi

      - name: Write local.properties
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          required=(
            RELEASE_KEYSTORE_PASSWORD
            RELEASE_KEY_ALIAS
            RELEASE_KEY_PASSWORD
            SUPABASE_URL
            SUPABASE_ANON_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret ${name}"
              exit 1
            fi
          done

          if [ -z "${ANDROID_HOME}" ]; then
            echo "::error::ANDROID_HOME is not set after Android SDK setup"
            exit 1
          fi

          # Escape backslashes and spaces for Java Properties format.
          escape_prop() {
            printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/ /\\ /g'
          }

          {
            echo "sdk.dir=$(escape_prop "${ANDROID_HOME}")"
            echo "RELEASE_KEYSTORE=keystore/release.jks"
            echo "RELEASE_KEYSTORE_PASSWORD=$(escape_prop "${RELEASE_KEYSTORE_PASSWORD}")"
            echo "RELEASE_KEY_ALIAS=$(escape_prop "${RELEASE_KEY_ALIAS}")"
            echo "RELEASE_KEY_PASSWORD=$(escape_prop "${RELEASE_KEY_PASSWORD}")"
            echo "SUPABASE_URL=$(escape_prop "${SUPABASE_URL}")"
            echo "SUPABASE_ANON_KEY=$(escape_prop "${SUPABASE_ANON_KEY}")"
          } > local.properties

      - name: Validate convention plugins
        run: ./gradlew :build-logic:convention:validatePlugins --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint (release)
        run: ./gradlew :app:lintRelease --stacktrace

      - name: Assemble signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Locate release APK
        id: apk
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No release APK found under app/build/outputs/apk/release/"
            exit 1
          fi
          if [ "${#apks[@]}" -gt 1 ]; then
            echo "::warning::Multiple APKs found; using ${apks[0]}"
          fi
          echo "path=${apks[0]}" >> "${GITHUB_OUTPUT}"
          echo "Found release APK: ${apks[0]}"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Resolve release notes
        id: notes
        env:
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          if [ -n "${INPUT_NOTES}" ]; then
            notes="${INPUT_NOTES}"
          else
            notes="$(git log -1 --pretty=%s)"
          fi
          {
            echo "text<<EOF"
            echo "${notes}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Distribute to Firebase App Distribution
        id: firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          file: ${{ steps.apk.outputs.path }}
          releaseNotes: ${{ steps.notes.outputs.text }}

      - name: Write job summary
        if: always()
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          RELEASE_NOTES: ${{ steps.notes.outputs.text }}
          TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          JOB_STATUS: ${{ job.status }}
          FIREBASE_CONSOLE_URI: ${{ steps.firebase.outputs.FIREBASE_CONSOLE_URI }}
          TESTING_URI: ${{ steps.firebase.outputs.TESTING_URI }}
          BINARY_DOWNLOAD_URI: ${{ steps.firebase.outputs.BINARY_DOWNLOAD_URI }}
        run: |
          {
            echo "## Firebase App Distribution"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | \`${JOB_STATUS}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| APK | \`${APK_PATH:-n/a}\` |"
            echo "| Firebase App ID | \`${FIREBASE_APP_ID:-n/a}\` |"
            echo "| Tester groups | \`${TESTER_GROUPS:-n/a}\` |"
            echo "| Firebase console | ${FIREBASE_CONSOLE_URI:-n/a} |"
            echo "| Tester invite / testing link | ${TESTING_URI:-n/a} |"
            echo "| Binary download | ${BINARY_DOWNLOAD_URI:-n/a} |"
            echo ""
            echo "### Release notes"
            echo ""
            echo "${RELEASE_NOTES:-_(none)_}"
            echo ""
            echo "Project console: [Firebase App Distribution](https://console.firebase.google.com/project/mobile-topup-5d3e1/appdistribution)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Scrub ephemeral credentials
        if: always()
        run: |
          rm -f local.properties keystore/release.jks
